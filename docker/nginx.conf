server {
    listen 80;
    server_name _;

    # Flutter Web (compiled release build)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to each domain service, path-prefixed so the whole app lives on
    # one origin. Trailing slashes on both `location` and `proxy_pass` strip the
    # /api/<service> prefix before forwarding (domain services have no prefix of
    # their own — only api-gateway sets one, and it isn't wired in front of these yet).
    location /api/identity-profile/     { proxy_pass http://identity-profile:3001/; }
    location /api/offer/                { proxy_pass http://offer:3002/; }
    location /api/discovery-location/   { proxy_pass http://discovery-location:3003/; }
    location /api/participation/        { proxy_pass http://participation:3004/; }
    location /api/messaging/            { proxy_pass http://messaging:3005/; }
    location /api/trust-safety/         { proxy_pass http://trust-safety:3006/; }
    location /api/entitlements-billing/ { proxy_pass http://entitlements-billing:3007/; }
    location /api/notification/         { proxy_pass http://notification:3008/; }
    location /api/media/                { proxy_pass http://media:3009/; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
