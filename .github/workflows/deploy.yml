name: Deploy

# Runs only after the existing CI workflow finishes successfully on main (never in
# parallel with it, and never on a red build) — see .github/workflows/ci.yml.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/backend.Dockerfile already bakes every one of the 9 domain services +
      # api-gateway into one image and switches entrypoint on SERVICE_NAME (see that
      # file's own comment) — build it once here; docker-compose.cloud.yml sets
      # SERVICE_NAME per container at runtime, not at build time, so no --build-arg
      # is needed.
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/app-stranger-backend:latest
            ghcr.io/${{ github.repository_owner }}/app-stranger-backend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web (Caddy) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web-cloud.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/app-stranger-web:latest
            ghcr.io/${{ github.repository_owner }}/app-stranger-web:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Targets the Strato Windows server's OpenSSH Server. Assumes its default
      # shell has been set to PowerShell (one-time setup: see infra/docker's
      # deployment notes) and that the repo has already been cloned once by hand to
      # the path below — this job only pulls + redeploys, it never clones fresh.
      #
      # STRATO_APP_DIR is interpolated directly into the script rather than passed
      # via the action's `envs:` input, which injects variables with bash's `export`
      # syntax — that's a no-op (silently ignored, not even an error PowerShell's
      # default ErrorActionPreference treats as terminating) under our PowerShell
      # remote shell, so $env:STRATO_APP_DIR was always empty and every step below
      # ran from the wrong directory while still reporting success.
      #
      # $ErrorActionPreference only catches PowerShell cmdlet errors, not exit codes
      # from native commands like git/docker — those need an explicit $LASTEXITCODE
      # check or the script silently continues past a failed step and still reports
      # success. `docker compose up -d` also gets a few retries: Docker Desktop's
      # Windows/WSL2 networking occasionally fails a fresh container's host-port
      # bind with "address already in use" even though nothing is actually listening
      # (a transient HNS race observed repeatedly standing this environment up) —
      # it reliably succeeds a few seconds later without any other change.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STRATO_HOST }}
          username: ${{ secrets.STRATO_SSH_USER }}
          key: ${{ secrets.STRATO_SSH_KEY }}
          script: |
            $ErrorActionPreference = "Stop"
            Set-Location "${{ secrets.STRATO_APP_DIR }}"

            git pull --ff-only
            if ($LASTEXITCODE -ne 0) { exit 1 }

            docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.cloud.yml --env-file infra/docker/.env.cloud pull
            if ($LASTEXITCODE -ne 0) { exit 1 }

            $upSucceeded = $false
            for ($i = 1; $i -le 12; $i++) {
              docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.cloud.yml --env-file infra/docker/.env.cloud up -d
              if ($LASTEXITCODE -eq 0) { $upSucceeded = $true; break }
              Write-Host "docker compose up -d failed (attempt $i/12), retrying in 15s..."
              Start-Sleep -Seconds 15
            }
            if (-not $upSucceeded) { exit 1 }

            docker image prune -f

  build-and-distribute-android:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Points the APK at the same public endpoint the web build reaches via Caddy
      # (docker/Caddyfile) — unlike the web build, mobile has no shared origin to be
      # relative against, so these must be absolute. `vars.SITE_ADDRESS` is a plain
      # (non-secret) repo variable holding the sslip.io hostname.
      #
      # Uses Flutter's default debug signing (no release keystore configured) — fine
      # for Firebase App Distribution test installs, NOT suitable for Play Store
      # submission; a real release keystore is a separate, later piece of work.
      - name: Build release APK
        working-directory: apps/stranger_flutter
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=IDENTITY_BASE_URL=https://${{ vars.SITE_ADDRESS }}/api/identity-profile \
            --dart-define=OFFER_BASE_URL=https://${{ vars.SITE_ADDRESS }}/api/offer \
            --dart-define=DISCOVERY_BASE_URL=https://${{ vars.SITE_ADDRESS }}/api/discovery-location \
            --dart-define=PARTICIPATION_BASE_URL=https://${{ vars.SITE_ADDRESS }}/api/participation \
            --dart-define=MESSAGING_BASE_URL=https://${{ vars.SITE_ADDRESS }}/api/messaging \
            --dart-define=TRUST_SAFETY_BASE_URL=https://${{ vars.SITE_ADDRESS }}/api/trust-safety \
            --dart-define=ENTITLEMENTS_BASE_URL=https://${{ vars.SITE_ADDRESS }}/api/entitlements-billing \
            --dart-define=NOTIFICATION_BASE_URL=https://${{ vars.SITE_ADDRESS }}/api/notification \
            --dart-define=MEDIA_BASE_URL=https://${{ vars.SITE_ADDRESS }}/api/media

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools appdistribution:distribute \
            apps/stranger_flutter/build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ secrets.FIREBASE_APP_ID }}" \
            --groups "testers"
